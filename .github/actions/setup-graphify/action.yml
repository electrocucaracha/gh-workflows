name: "Setup Graphify"
description: "Installs uv and Graphify, then generates the repository map graph."
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      with:
        enable-cache: false
    - name: Generate repository map with Graphify
      shell: bash
      # Literal paths only; no attacker-controlled input reaches GITHUB_PATH.
      run: | # zizmor: ignore[github-env]
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        uv tool install "graphifyy[mcp]"
        graphify --version
        graphify-mcp --help
        graphify . --no-viz --code-only
        test -s graphify-out/graph.json
        printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"graphify-smoke","version":"1.0"}}}' |
          graphify-mcp graphify-out/graph.json |
          jq -e 'select(.result.serverInfo.name != null)'
