name: "Setup Graphify"
description: "Installs uv and Graphify, then generates the repository map graph."
runs:
  using: composite
  steps:
    - name: Set up uv
      uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        enable-cache: false
    - name: Generate repository map with Graphify
      shell: bash
      # Literal paths only; no attacker-controlled input reaches GITHUB_PATH.
      run: | # zizmor: ignore[github-env]
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/bin:$PATH"
        uv tool install "graphifyy[mcp]"
        graphify --version
        graphify-mcp --help
        graphify . --no-viz --code-only
        test -s graphify-out/graph.json
    - name: Verify Graphify MCP discovery and query
      shell: bash
      run: node "$GITHUB_ACTION_PATH/check-mcp.mjs"
