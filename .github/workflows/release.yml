name: Release with AI Changelog
# yamllint disable-line rule:truthy
on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      publish:
        description: "Publish the release after the changelog pull request has been reviewed and merged."
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  prepare:
    if: inputs.publish != true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Set up Ollama
        uses: ai-action/setup-ollama@85cd2094215be6b76d0ad90e93393647dc7a55ba # v2.1.16
      - name: Generate changelog
        run: |
          uvx --from git+https://github.com/electrocucaracha/ai-changelog.git@61613b655dd1fc60693f1f6002bad8e1bad9cc99 ai-changelog --create-semver-tags .
          make fmt
      - name: Prepare review artifact
        run: |
          TAG="$(awk '/^## \[Unreleased\]/{next} /^## \[[0-9]+\.[0-9]+\.[0-9]+([+-][^]]+)?\]/{sub(/^## \[/, ""); sub(/\].*/, ""); print; exit}' CHANGELOG.md)"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "No valid release version found in CHANGELOG.md after generation"
              exit 1
          fi
          mkdir release-artifact
          cp CHANGELOG.md release-artifact/
          awk '/^## / { count++ } count == 3 { exit } { print }' CHANGELOG.md > release-artifact/body.md
          printf '%s\n' "$TAG" > release-artifact/release-tag.txt
      - name: Upload changelog for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-changelog
          path: release-artifact/
          if-no-files-found: error
          retention-days: 1
  propose:
    if: inputs.publish != true
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download changelog artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-changelog
          path: release-artifact
      - name: Create changelog pull request
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(cat release-artifact/release-tag.txt)"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "The generated release tag is invalid."
              exit 1
          fi
          cp release-artifact/CHANGELOG.md CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --staged --quiet; then
              echo "No changelog changes to propose." >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi
          git commit -m "docs(changelog): update release notes for ${TAG}"
          BRANCH="release/changelog-${TAG}"
          OPEN_PR="$(gh pr list --head "${BRANCH}" --state open --json number --jq 'length')"
          if [ "$OPEN_PR" -gt 0 ]; then
              echo "An open changelog PR already exists for ${TAG}." >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
              push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create \
              --title "docs(changelog): prepare release ${TAG}" \
              --body-file release-artifact/body.md \
              --base "${BASE_BRANCH}" \
              --head "${BRANCH}"
  publish:
    if: inputs.publish == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve reviewed release tag
        id: release_tag
        run: |
          TAG="$(awk '/^## \[Unreleased\]/{next} /^## \[[0-9]+\.[0-9]+\.[0-9]+([+-][^]]+)?\]/{sub(/^## \[/, ""); sub(/\].*/, ""); print; exit}' CHANGELOG.md)"
          if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
              echo "No valid release version found in CHANGELOG.md"
              exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          awk '/^## / { count++ } count == 3 { exit } { print }' CHANGELOG.md > body.md
      - name: Publish reviewed tag
        env:
          TAG: ${{ steps.release_tag.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
              echo "Publish must run from the default branch after merging the changelog PR."
              exit 1
          fi
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
              ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Release tag ${TAG} already exists on origin"
              exit 1
          fi
          git tag "${TAG}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${AUTH_HEADER}" \
              push origin "refs/tags/${TAG}:refs/tags/${TAG}"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          gh release create "${TAG}" \
            --notes-file body.md \
            --verify-tag
