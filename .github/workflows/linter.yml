name: "CI: Lint and Static Checks"
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_call:
    inputs:
      validate_overrides:
        description: >-
          JSON object of VALIDATE_* super-linter env var overrides, e.g. '{"VALIDATE_PYTHON": false, "VALIDATE_JAVASCRIPT_ES": true}'. Merged on top of this workflow's defaults.
        type: string
        required: false
        default: "{}"
    secrets:
      COPILOT_TOKEN:
        description: "Deprecated and unused; accepted for existing callers."
        required: false
permissions:
  contents: read
jobs:
  check-super-linter:
    name: Run Super-Linter Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure linter validations
        id: linter-config
        env:
          VALIDATE_OVERRIDES: ${{ inputs.validate_overrides || '{}' }}
        run: |
          set -euo pipefail

          echo "$VALIDATE_OVERRIDES" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      - name: Run Super-Linter validation
        id: linter-validation
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: /
          SAVE_SUPER_LINTER_OUTPUT: true
          KUBERNETES_KUBECONFORM_OPTIONS: "-ignore-missing-schemas"
          DEFAULT_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: File issue with failed linter logs
        id: linter-issue
        if: failure() && steps.linter-validation.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from textwrap import indent

          MAX_LOG_BYTES = 60_000


          def failed_entries(value):
              if isinstance(value, dict):
                  if value.get("Exitval") not in (None, 0, "0", "0.0"):
                      yield value
                  else:
                      for nested in value.values():
                          yield from failed_entries(nested)
              elif isinstance(value, list):
                  for nested in value:
                      yield from failed_entries(nested)


          structured = []
          raw = []
          output = Path("super-linter-output")
          paths = sorted(output.rglob("*")) if not output.is_symlink() else []
          for path in paths:
              if not path.is_file() or path.is_symlink():
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if path.suffix.lower() == ".json":
                  try:
                      entries = list(failed_entries(json.loads(text)))
                  except json.JSONDecodeError:
                      raw.append((path, text))
                      continue
                  if entries:
                      structured.append((path, json.dumps(entries, indent=2, ensure_ascii=False)))
              elif text.strip():
                  raw.append((path, text))

          sections = [
              f"Workflow run: {os.environ['RUN_URL']}",
              f"Commit: {os.environ['COMMIT_SHA']}",
              "## Failed linter logs",
          ]
          logs = structured or raw
          for path, text in logs:
              sections.append(f"### {path}\n\n{indent(text.rstrip(), '    ')}")
          if not logs:
              sections.append(
                  "Super-Linter did not save diagnostic entries. "
                  "See the workflow run above for the failed step's logs."
              )
          body = "\n\n".join(sections) + "\n"
          encoded = body.encode("utf-8")
          if len(encoded) > MAX_LOG_BYTES:
              body = encoded[:MAX_LOG_BYTES].decode("utf-8", errors="ignore")
              body += "\n\nLog entries truncated; see the workflow run above for the full logs.\n"
          report_path = Path(os.environ["RUNNER_TEMP"]) / "linter-issue.md"
          report_path.write_text(body, encoding="utf-8")
          PY

          gh api "repos/$GH_REPO/labels/super-linter-issue" > /dev/null ||
            gh label create super-linter-issue --description "Super-Linter failures awaiting repair" --color B60205
          issue_number=$(gh issue list --state open --label super-linter-issue \
            --search '"super-linter GitHub action has failed" in:title' \
            --json number,title \
            --jq 'map(select(.title == "super-linter GitHub action has failed"))[0].number // empty')
          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$RUNNER_TEMP/linter-issue.md"
          else
            gh issue create --title "super-linter GitHub action has failed" \
              --label super-linter-issue --body-file "$RUNNER_TEMP/linter-issue.md"
          fi
