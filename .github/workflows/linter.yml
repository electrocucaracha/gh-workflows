name: "CI: Lint and Static Checks"
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      validate_overrides:
        description: >-
          JSON object of VALIDATE_* super-linter env var overrides, e.g. '{"VALIDATE_PYTHON": false, "VALIDATE_JAVASCRIPT_ES": true}'. Merged on top of this workflow's defaults.
        type: string
        required: false
        default: "{}"
    secrets:
      COPILOT_TOKEN:
        required: true
jobs:
  check-super-linter:
    name: Run Super-Linter Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure linter validations
        id: linter-config
        env:
          VALIDATE_OVERRIDES: ${{ inputs.validate_overrides || '{}' }}
        run: |
          set -euo pipefail

          echo "$VALIDATE_OVERRIDES" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      - name: Run Super-Linter validation
        id: linter-validation
        uses: super-linter/super-linter@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: /
          SAVE_SUPER_LINTER_OUTPUT: true
          KUBERNETES_KUBECONFORM_OPTIONS: "-ignore-missing-schemas"
          DEFAULT_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: Install RTK token saver
        if: always()
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v0.45.0/install.sh | sh
          rtk --version
          rtk init --global --copilot
      - name: Set up uv
        if: failure()
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Generate repository map with Graphify
        if: failure()
        run: |
          uv tool install graphifyy
          graphify --version
          graphify . --no-viz --code-only
      - name: Run Copilot CLI analysis and file issue
        uses: austenstone/copilot-cli@5a9fbe56fd6cdb5e50d329fd87c751748cf5182f # v4.0
        id: ai-linter-analysis
        if: failure()
        env:
          COPILOT_TOKEN: ${{ secrets.COPILOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          allow-all-tools: true
          denied-tools: "shell(rm:*),shell(sudo:*),shell(chown:*),shell(chmod:777),shell(dd:*)"
          allow-all-paths: true
          allow-all-urls: true
          mcp-config: |
            {
              "mcpServers": {
                "graphify": {
                  "command": "graphify",
                  "args": [".", "--mcp"]
                }
              }
            }
          agent: principal-software-engineer
          prompt: |
            You are an expert software engineer who specializes in diagnosing and fixing software build and runtime failures.

            Task: The Super-Linter step of this workflow run failed. Gather your own evidence, diagnose the root cause, and file (or update) a GitHub issue with the results.

            Gather evidence yourself, using the shell and MCP tools available to you:
            - Repository structure: the generated Graphify graph and report in graphify-out/GRAPH_REPORT.md are already built; use the Graphify MCP tools (query_graph, get_node, get_neighbors, shortest_path) to navigate the codebase instead of scanning the tree blindly.
            - Structured diagnostics: find JSON files under ./super-linter-output whose "Exitval" field is non-zero; each one names the failing linter, file, and line.
            - Raw output: if no structured JSON errors exist, inspect the non-JSON files under ./super-linter-output for the failure details.
            - Code diff: run `git diff` (the checkout has full history, fetch-depth 0) against the base of this branch/PR to see what changed.

            Diagnosis body format:
            ## Summary
            One or two plain-language sentences stating what broke (which linter(s), how many files) so a reader can grasp the failure without reading further.

            ## Diagnosis
            State the most likely root cause and cite the linter, file, line, and message.

            ## Fix Now
            Give the smallest concrete fix that resolves this failure today. Include a unified diff only when the change is unambiguous.

            ## Verification
            Name the command or workflow check that should confirm the fix.

            ## Copilot Prompt
            Emit a single fenced ```text block containing a self-contained, copy-paste prompt for a coding agent (GitHub Copilot) running inside this repository.
            The prompt must name the exact files and line numbers to edit, restate the linter rule IDs being violated, describe the expected end state, and end with the verification command. Do not reference this issue or any external context the agent cannot read.

            ## Prevent Recurrence
            Recommend one durable safeguard so this class of failure does not recur, chosen from: a linter config change (with the file path and setting), a pre-commit hook entry, an editorconfig or formatter rule, or a workflow guard. Give the concrete snippet and where it goes. If the failure was a one-off with no reasonable safeguard, say so explicitly instead of inventing one.

            If the evidence is insufficient, say exactly what is missing and point to the relevant workflow log section instead of inventing a cause. Never file an issue containing only generic or placeholder text; every section must reference concrete evidence you gathered.

            Issue filing:
            - Use the `gh` CLI (GITHUB_TOKEN is set in the environment) against repository ${{ github.repository }}.
            - Search for an existing open issue labeled "super-linter-issue" titled "super-linter GitHub action has failed".
            - If one exists, add a comment to it with the diagnosis body above. Otherwise create a new issue with that title and label.
            - Prepend the diagnosis body with a link to this run's logs: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          fail-on-error: true
      - name: Collect Copilot usage metrics
        if: always()
        env:
          NO_COLOR: "1"
        run: |
          {
            echo "## Copilot CLI Usage Metrics"
            echo
            echo "### ccusage"
            echo '```'
            npx -y ccusage@latest copilot daily 2>&1 || echo "ccusage reported no Copilot CLI usage data for this run."
            echo '```'
            echo
            echo "### rtk stats"
            echo '```'
            rtk gain 2>&1 || echo "rtk reported no usage data for this run."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
