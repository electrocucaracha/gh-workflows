name: "CI: Lint and Static Checks"
# yamllint disable-line rule:truthy
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_call:
    inputs:
      validate_overrides:
        description: >-
          JSON object of VALIDATE_* super-linter env var overrides, e.g. '{"VALIDATE_PYTHON": false, "VALIDATE_JAVASCRIPT_ES": true}'. Merged on top of this workflow's defaults.
        type: string
        required: false
        default: "{}"
permissions:
  contents: read
jobs:
  check-super-linter:
    name: Run Super-Linter Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure linter validations
        id: linter-config
        env:
          VALIDATE_OVERRIDES: ${{ inputs.validate_overrides || '{}' }}
        run: |
          set -euo pipefail

          echo "$VALIDATE_OVERRIDES" | jq -r 'to_entries[] | "\(.key)=\(.value)"' >> "$GITHUB_ENV"
      - name: Run Super-Linter validation
        id: linter-validation
        uses: super-linter/super-linter@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: /
          SAVE_SUPER_LINTER_OUTPUT: true
          KUBERNETES_KUBECONFORM_OPTIONS: "-ignore-missing-schemas"
          DEFAULT_BRANCH: ${{ github.head_ref || github.ref_name }}
      - name: File issue with failed linter logs
        id: linter-issue
        if: failure() && steps.linter-validation.outcome == 'failure' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from textwrap import indent

          MAX_LOG_BYTES = 60_000


          def failed_entries(value):
              if isinstance(value, dict):
                  if value.get("Exitval") not in (None, 0, "0", "0.0"):
                      yield value
                  else:
                      for nested in value.values():
                          yield from failed_entries(nested)
              elif isinstance(value, list):
                  for nested in value:
                      yield from failed_entries(nested)


          structured = []
          raw = []
          output = Path("super-linter-output")
          paths = sorted(output.rglob("*")) if not output.is_symlink() else []
          for path in paths:
              if not path.is_file() or path.is_symlink():
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              if path.suffix.lower() == ".json":
                  try:
                      entries = list(failed_entries(json.loads(text)))
                  except json.JSONDecodeError:
                      raw.append((path, text))
                      continue
                  messages = [
                      re.sub(r"\x1b\[[0-?]*[ -/]*[@-~]", "", entry.get(stream) or "").strip()
                      for entry in entries
                      for stream in ("Stdout", "Stderr")
                  ]
                  diagnostics = "\n\n".join(message for message in messages if message)
                  if diagnostics:
                      structured.append((path, diagnostics))
              elif text.strip():
                  raw.append((path, text))

          def linter_name(path):
              match = re.match(r"super-linter-worker-results-(.+)\.json$", path.name)
              return match.group(1) if match else path.name


          logs = [
              (linter_name(path), text.replace("/github/workspace/", ""))
              for path, text in (structured or raw)
          ]
          sha = os.environ["COMMIT_SHA"]
          sections = [
              f"<!-- super-linter-commit: {sha} -->",
              f"Workflow run: {os.environ['RUN_URL']}",
              f"Commit: {sha}",
              f"Ref: {os.environ['REF_NAME']}",
              "Failed linters: " + (", ".join(f"`{name}`" for name, _ in logs) or "unknown"),
              "## Failed linter logs",
          ]
          # Per-linter budget so one noisy linter cannot hide the others.
          budget = MAX_LOG_BYTES // max(len(logs), 1)
          for name, text in logs:
              encoded = text.rstrip().encode("utf-8")
              if len(encoded) > budget:
                  text = encoded[:budget].decode("utf-8", errors="ignore")
                  text += "\n[truncated; see the workflow run for the full log]"
              sections.append(f"### {name}\n\n{indent(text.rstrip(), '    ')}")
          if not logs:
              sections.append(
                  "Super-Linter did not save diagnostic entries. "
                  "See the workflow run above for the failed step's logs."
              )
          body = "\n\n".join(sections) + "\n"
          report_path = Path(os.environ["RUNNER_TEMP"]) / "linter-issue.md"
          report_path.write_text(body, encoding="utf-8")
          PY

          gh api "repos/$GH_REPO/labels/super-linter-issue" > /dev/null ||
            gh label create super-linter-issue --description "Super-Linter failures awaiting repair" --color B60205
          issue_number=$(gh issue list --state open --label super-linter-issue \
            --search '"super-linter GitHub action has failed" in:title' \
            --json number,title \
            --jq 'map(select(.title == "super-linter GitHub action has failed"))[0].number // empty')
          if [ -n "$issue_number" ]; then
            # push and pull_request runs on the same commit report identical failures.
            if gh issue view "$issue_number" --json body,comments \
              --jq '[.body, .comments[].body] | join("\n")' |
              grep -qF "super-linter-commit: $COMMIT_SHA"; then
              echo "Failure for $COMMIT_SHA already reported in #$issue_number"
              exit 0
            fi
            gh issue comment "$issue_number" --body-file "$RUNNER_TEMP/linter-issue.md"
          else
            gh issue create --title "super-linter GitHub action has failed" \
              --label super-linter-issue --body-file "$RUNNER_TEMP/linter-issue.md"
          fi
