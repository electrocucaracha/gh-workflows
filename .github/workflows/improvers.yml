name: "Maintenance: Code Base Quality Improvements"
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 15 * *"
  workflow_dispatch:
    inputs:
      model:
        description: Copilot CLI model
        type: string
        default: gpt-5.4-mini
      coverage-command:
        description: Optional trusted command to generate coverage (Go is detected automatically)
        type: string
        default: ""
      coverage-report:
        description: Repository-relative coverage report generated by coverage-command
        type: string
        default: coverage.out
  workflow_call:
    inputs:
      model:
        description: Copilot CLI model
        type: string
        default: gpt-5.4-mini
      coverage-command:
        description: Optional trusted command to generate coverage (Go is detected automatically)
        type: string
        default: ""
      coverage-report:
        description: Repository-relative coverage report generated by coverage-command
        type: string
        default: coverage.out
    secrets:
      COPILOT_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: code-quality-verifiers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run-improvers:
    name: ${{ matrix.name }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: reduce-tech-debt
            name: Reduce Technical Debt
            branch: tech-debt-reduction
            agent: janitor
            prompt: |-
              Reduce technical debt and submit a Pull Request with the improvements.

              Workflow:
              1. Read .improvers-evidence.txt first. Use bounded rtk git grep and targeted file reads, not a whole-repository audit.
              2. Select exactly one small, evidence-backed simplification. Do not update dependencies or undertake unrelated cleanup.
              3. Delete and simplify safely. Preserve behavior and public APIs. Stop without a PR if no safe improvement is found.
              4. Validate by running: rtk make test
              5. Create a new branch and push it:
                 - rtk git checkout -b tech-debt-reduction
                 - rtk git push origin tech-debt-reduction
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI through RTK: rtk gh pr create \
                   --title "chore: reduce technical debt" \
                   --body "Summary of changes, rationale, tests passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head tech-debt-reduction
                 - Keep the diff focused and reviewable.
          - id: remove-ignored-rules
            name: Review Ignored/Suppressed Rules
            branch: remove-ignored-rules
            agent: janitor
            prompt: |-
              Fix at most one unnecessary suppression from the supplied candidate list.

              Workflow:
              1. Read .improvers-evidence.txt first. Do not scan the repository again for candidates.
              2. Inspect only the candidate and its directly related code or configuration.
              3. Fix the underlying issue and remove one suppression if safe. Leave intentional exceptions unchanged. Stop without a PR if none is safely fixable.
              4. Validate by running: rtk make test and rtk make lint
              5. Create a new branch and push it:
                 - rtk git checkout -b remove-ignored-rules
                 - rtk git push origin remove-ignored-rules
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI through RTK: rtk gh pr create \
                   --title "chore: remove unnecessary rule suppressions" \
                   --body "Summary of suppressions removed, fixes applied, remaining justified exceptions, tests/lint passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head remove-ignored-rules
                 - Keep the diff focused and reviewable.
          - id: improve-code-coverage
            name: Improve Code Coverage
            branch: increase-code-coverage
            agent: qa-subagent
            prompt: |-
              Cover one uncovered function with at most three meaningful tests and submit a Pull Request.

              Workflow:
              1. Read .improvers-evidence.txt for coverage evidence already generated by CI. Do not download or inspect historical workflow logs.
              2. Select one uncovered function and read only its implementation, existing tests, and directly related helpers.
              3. Add at most three meaningful tests for important uncovered behavior. Do not run mutation testing, delegate to subagents, or undertake unrelated cleanup.
              4. Validate by running: rtk make test
              5. Create a new branch and push it:
                 - rtk git checkout -b increase-code-coverage
                 - rtk git push origin increase-code-coverage
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI through RTK: rtk gh pr create \
                   --title "test: increase code coverage" \
                   --body "Summary of added tests, rationale for coverage improvement, tests passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head increase-code-coverage
                 - Keep the diff focused and reviewable.
          - id: perspective-review
            name: Perspective-Based Code Review
            branch: ""
            agent: ""
            prompt: |-
              Perform an independent code review of this repository from the perspective and focus areas defined in your own agent instructions.

              This is a review-only task: do NOT modify, create, or delete any repository files, and do NOT open a Pull Request. Your only output is a GitHub issue.

              Workflow:
              1. Read .improvers-evidence.txt first. Select one area relevant to your persona; do not audit the whole repository or delegate to subagents.
              2. Examine only that area and its direct dependencies. Report at most three verified findings.
              3. Prioritize findings that are concrete and actionable; cite exact file paths (and line numbers when applicable). Use `rtk` for any shell inspection, for example `rtk git grep` and `rtk cat`.
              4. Do not restate generic best practices; every finding must reference actual code or docs found in this repository.

              Issue body format:
              ## Persona
              State the reviewer persona and its focus area.

              ## Findings
              A bulleted list of concrete drawbacks/blind spots, each with a file path (and line number if applicable) and a one- or two-sentence explanation of the risk.

              ## Recommendations
              For each finding, one concrete, actionable recommendation.

              ## Out of Scope
              Note anything you considered but could not verify due to lack of evidence, rather than speculating.

              Issue filing:
              - Use the `gh` CLI through RTK, for example `rtk gh issue list` and `rtk gh issue create` (GITHUB_TOKEN is set in the environment), against repository ${{ github.repository }}.
              - Title the issue "Perspective review".
              - Label it "perspective-review" (create the label first if it does not exist).
              - If an open issue with this exact title already exists, update it instead of creating a duplicate.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go for coverage
        if: matrix.id == 'improve-code-coverage' && hashFiles('go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Prepare bounded task evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          TASK_ID: ${{ matrix.id }}
          BRANCH: ${{ matrix.branch }}
          COVERAGE_COMMAND: ${{ inputs.coverage-command }}
          COVERAGE_REPORT: ${{ inputs.coverage-report || 'coverage.out' }}
        run: |
          set -euo pipefail
          echo "run=false" >> "$GITHUB_OUTPUT"
          if [ -n "$BRANCH" ]; then
            count=$(gh pr list --head "$BRANCH" --state open --json number --jq 'length')
            if [ "$count" -gt 0 ]; then
              echo "An improvement PR for $BRANCH is already open." | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          evidence=.improvers-evidence.txt
          if git ls-files --error-unmatch "$evidence" >/dev/null 2>&1; then
            echo "::error::$evidence is reserved for generated task evidence."
            exit 1
          fi
          printf '\n/%s\n' "$evidence" >> .git/info/exclude
          {
            echo "Task: $TASK_ID"
            echo "Scope: one improvement only. No subagents, dependency upgrades, or mutation testing."
            echo "Run targeted tests first, then required validation once. Stop and report validation failures; do not loop on unrelated failures."
            echo "Never commit this generated evidence file or generated coverage."
          } > "$evidence"
          case "$TASK_ID" in
            remove-ignored-rules)
              set +e
              git grep -n -I -E 'nolint|go:build ignore|jscpd:ignore|yamllint disable|shellcheck disable|noqa|markdownlint-disable|zizmor: ignore|VALIDATE_.*false' -- . ':!.github/agents' ':!docs' > "$RUNNER_TEMP/suppression-candidates"
              status=$?
              set -e
              if [ "$status" -gt 1 ]; then
                echo "::error::Suppression discovery failed."
                exit "$status"
              fi
              git ls-files '*actionlint*' '*zizmor*' '*trivy*' '*ignore' >> "$RUNNER_TEMP/suppression-candidates"
              if [ ! -s "$RUNNER_TEMP/suppression-candidates" ]; then
                echo "No suppression candidates; skipping Copilot." | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              head -n 80 "$RUNNER_TEMP/suppression-candidates" >> "$evidence"
              ;;
            improve-code-coverage)
              if [ -n "$COVERAGE_COMMAND" ]; then
                # This command is trusted caller configuration, not event text.
                bash -e -o pipefail -c "$COVERAGE_COMMAND"
              elif [ -f go.mod ]; then
                COVERAGE_REPORT="$RUNNER_TEMP/improvers-coverage.out"
                go test ./... -coverprofile="$COVERAGE_REPORT" > "$RUNNER_TEMP/coverage-test.log" 2>&1 || {
                  cat "$RUNNER_TEMP/coverage-test.log"
                  exit 1
                }
              elif [ ! -s "$COVERAGE_REPORT" ]; then
                echo "::notice::No coverage report. Configure coverage-command and coverage-report for non-Go repositories; skipping Copilot."
                exit 0
              fi
              if [ ! -s "$COVERAGE_REPORT" ]; then
                echo "::error::Coverage report missing or empty: $COVERAGE_REPORT"
                exit 1
              fi
              if head -n 1 "$COVERAGE_REPORT" | grep -q '^mode:'; then
                go tool cover -func="$COVERAGE_REPORT" > "$RUNNER_TEMP/coverage-functions"
                awk '$NF != "100.0%" && $1 != "total:"' "$RUNNER_TEMP/coverage-functions" > "$RUNNER_TEMP/coverage-gaps"
                if [ ! -s "$RUNNER_TEMP/coverage-gaps" ]; then
                  echo "No uncovered Go functions; skipping Copilot." | tee -a "$GITHUB_STEP_SUMMARY"
                  exit 0
                fi
                head -n 80 "$RUNNER_TEMP/coverage-gaps" >> "$evidence"
              else
                awk 'NR <= 160 { print substr($0, 1, 500) }' "$COVERAGE_REPORT" >> "$evidence"
              fi
              ;;
            *)
              git ls-files | sed -n '1,80p' >> "$evidence"
              ;;
          esac
          echo "run=true" >> "$GITHUB_OUTPUT"
      - name: Install RTK token saver
        if: steps.evidence.outputs.run == 'true'
        uses: electrocucaracha/gh-workflows/.github/actions/setup-rtk@0df06b4e1880bf64e290783ddbfe850f849a27af # v9.4.1
      - name: Generate repository map with Graphify
        if: steps.evidence.outputs.run == 'true'
        uses: electrocucaracha/gh-workflows/.github/actions/setup-graphify@0df06b4e1880bf64e290783ddbfe850f849a27af # v9.4.1
      - name: Select a random reviewer persona
        id: persona
        if: steps.evidence.outputs.run == 'true' && matrix.id == 'perspective-review'
        run: |
          set -euo pipefail

          # Pool of reviewer persona agents defined under .github/agents
          personas=(
            security-auditor
            performance-engineer
            accessibility-specialist
            site-reliability-engineer
            junior-developer
            technical-writer
            compliance-reviewer
            skeptical-staff-engineer
          )
          index=$(( RANDOM % ${#personas[@]} ))
          agent="${personas[$index]}"
          role=$(grep -m1 '^name:' ".github/agents/${agent}.agent.md" | sed -E 's/^name:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')

          echo "agent=${agent}" >> "$GITHUB_OUTPUT"
          echo "role=${role}" >> "$GITHUB_OUTPUT"
          echo "Selected persona: ${role} (${agent})"
      - name: Check agent Graphify access
        if: steps.evidence.outputs.run == 'true'
        env:
          AGENT: ${{ matrix.agent || steps.persona.outputs.agent }}
        run: |
          set -euo pipefail
          if ! awk '/^---$/ { section++; next } section == 1 { print }' ".github/agents/${AGENT}.agent.md" |
            grep -F '"graphify/*"' >/dev/null; then
            echo "::error::Refresh .github/agents/${AGENT}.agent.md: its tools allowlist must include \"graphify/*\"."
            exit 1
          fi
      - name: Run Copilot CLI improvement agent
        id: copilot
        if: steps.evidence.outputs.run == 'true'
        timeout-minutes: 10
        uses: austenstone/copilot-cli@5a9fbe56fd6cdb5e50d329fd87c751748cf5182f # v4.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          repo-token: ${{ github.token }}
          model: ${{ inputs.model || 'gpt-5.4-mini' }}
          autopilot: false
          silent: false
          upload-artifact: false
          log-level: info
          disable-builtin-mcps: true
          mcp-config: |
            {
              "mcpServers": {
                "graphify": {
                  "type": "local",
                  "command": "graphify-mcp",
                  "args": ["graphify-out/graph.json"],
                  "tools": ["*"]
                }
              }
            }
          allow-all-tools: true
          denied-tools: "shell(rm:*),shell(sudo:*),shell(chown:*),shell(chmod:777),shell(dd:*)"
          allow-all-paths: true
          allow-all-urls: true
          agent: ${{ matrix.agent || steps.persona.outputs.agent }}
          prompt: |
            ${{ matrix.prompt }}

            Graphify requirement:
            Before inspecting implementation files, call graphify/query_graph for the selected candidate or area with depth 1 and token_budget 500.
            Use the result to choose targeted file reads; do not request the whole graph or repeat queries without a specific dependency question.
            If Graphify tools are unavailable or a query fails, stop and report the failure rather than silently substituting a repository scan.
            In your final response, name the Graphify tools actually invoked and how their results informed the work.
          fail-on-error: true
      - name: Collect Copilot usage metrics
        if: always()
        env:
          METRICS_NAME: ${{ matrix.name }}
          PERSONA_ROLE: ${{ steps.persona.outputs.role }}
          MODEL: ${{ inputs.model || 'gpt-5.4-mini' }}
          AGENT_RAN: ${{ steps.evidence.outputs.run }}
        run: |
          {
            if [ -n "$PERSONA_ROLE" ]; then
              printf '## %s (%s)\n' "$METRICS_NAME" "$PERSONA_ROLE"
            else
              printf '## %s\n' "$METRICS_NAME"
            fi
            echo
            echo "### Copilot usage"
            printf "Model: \`%s\`; autopilot: off; agent step timeout: 10 minutes.\n" "$MODEL"
            printf "Task eligible to run: \`%s\`.\n" "$AGENT_RAN"
            echo "Native Copilot usage statistics are printed in the agent step log."
            echo "Session logs are uploaded separately; RTK savings below are not billing totals."
            echo "Graphify startup checks are not proof of Copilot tool use; inspect the agent tool-call trace in its logs."
            echo
            echo "### rtk stats"
            echo '```'
            if command -v rtk >/dev/null 2>&1; then
              rtk gain
            else
              echo "RTK was not installed because the agent was skipped or setup failed."
            fi
            echo '```'
            echo
          } | tee "metrics-${{ matrix.id }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Copilot session logs
        if: always() && steps.copilot.outputs.logs-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-session-${{ matrix.id }}
          path: ${{ steps.copilot.outputs.logs-path }}
          retention-days: 7
          if-no-files-found: warn
      - name: Upload Copilot usage metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: copilot-metrics-${{ matrix.id }}
          path: metrics-${{ matrix.id }}.md
          if-no-files-found: warn
  summarize:
    name: Publish Improvement Summary
    needs: run-improvers
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download Copilot usage metrics
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: copilot-metrics-*
          path: metrics
          merge-multiple: true
      - name: Publish improvement summary
        run: |
          echo "# Maintenance Improvement Metrics" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if find metrics -type f -name '*.md' | grep -q .; then
            find metrics -type f -name '*.md' -print | sort | while read -r metrics_file; do
              cat "$metrics_file" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No metrics artifacts were produced." >> "$GITHUB_STEP_SUMMARY"
          fi
