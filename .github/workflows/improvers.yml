name: "Maintenance: Code Base Quality Improvements"
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 15 * *"
  workflow_dispatch:
  workflow_call:
    secrets:
      COPILOT_TOKEN:
        required: true
permissions:
  contents: read
concurrency:
  group: code-quality-verifiers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  run-improvers:
    name: ${{ matrix.name }}
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: reduce-tech-debt
            name: Reduce Technical Debt
            agent: janitor
            prompt: |-
              Reduce technical debt and submit a Pull Request with the improvements.

              Workflow:
              1. Review the generated Graphify graph and report in graphify-out/GRAPH_REPORT.md, then use the Graphify MCP tools (query_graph, get_node, get_neighbors, shortest_path) to navigate the codebase instead of scanning the tree blindly.
              2. Analyze the repo for unused code, duplication, dead paths, and unnecessary complexity.
              3. Delete and simplify safely. Preserve behavior and avoid breaking public APIs.
              4. Validate by running: rtk make test
              5. Create a new branch and push it:
                 - rtk git checkout -b tech-debt-reduction
                 - rtk git push origin tech-debt-reduction
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI through RTK: rtk gh pr create \
                   --title "chore: reduce technical debt" \
                   --body "Summary of changes, rationale, tests passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head tech-debt-reduction
                 - Keep the diff focused and reviewable.
          - id: remove-ignored-rules
            name: Review Ignored/Suppressed Rules
            agent: janitor
            prompt: |-
              Review the codebase and configuration files for rules that are being ignored or suppressed, and remove that suppression by fixing the underlying issue with best practices where feasible.

              Workflow:
              1. Review the generated Graphify graph and report in graphify-out/GRAPH_REPORT.md, then use the Graphify MCP tools (query_graph, get_node, get_neighbors, shortest_path) to navigate the codebase instead of scanning the tree blindly.
              2. Search for suppression markers across the repo, including but not limited to:
                 - Go: `//nolint`, `//go:build ignore`
                 - jscpd: `jscpd:ignore-start` / `jscpd:ignore-end`
                 - YAML lint: `yamllint disable`, `yamllint disable-line`
                 - Shellcheck: `# shellcheck disable=`
                 - actionlint: entries in actionlint.yml
                 - zizmor: entries in zizmor.yaml
                 - trivy: entries in trivy.yaml or `.trivyignore`
                 - Super-Linter / other linters: `VALIDATE_*` exclusions, `.gitignore`-style ignore files, inline `# noqa`, `<!-- markdownlint-disable -->`
              3. For each suppression found, evaluate whether the underlying issue can be fixed properly instead of ignored:
                 - If fixable, apply the best-practice fix and remove the suppression.
                 - If not safely fixable (for example a false positive or an intentional, well-justified exception), leave the suppression in place but ensure it has a clear one-line comment explaining why it exists.
                4. Validate by running: rtk make test and rtk make lint
              5. Create a new branch and push it:
                 - rtk git checkout -b remove-ignored-rules
                 - rtk git push origin remove-ignored-rules
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI through RTK: rtk gh pr create \
                   --title "chore: remove unnecessary rule suppressions" \
                   --body "Summary of suppressions removed, fixes applied, remaining justified exceptions, tests/lint passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head remove-ignored-rules
                 - Keep the diff focused and reviewable.
          - id: improve-code-coverage
            name: Improve Code Coverage
            agent: qa-subagent
            prompt: |-
              Increase code coverage and submit a Pull Request with the improvements.

              Workflow:
              1. Review the generated Graphify graph and report in graphify-out/GRAPH_REPORT.md, then use the Graphify MCP tools (query_graph, get_node, get_neighbors, shortest_path) to navigate the codebase instead of scanning the tree blindly.
              2. Analyze the latest results of unit-test and gremlins-test GitHub Actions jobs to identify uncovered code paths and functions.
              3. Write new tests to cover those paths, ensuring they are meaningful and validate important edge cases.
              4. Validate by running: rtk make test
              5. Create a new branch and push it:
                 - rtk git checkout -b increase-code-coverage
                 - rtk git push origin increase-code-coverage
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI through RTK: rtk gh pr create \
                   --title "test: increase code coverage" \
                   --body "Summary of added tests, rationale for coverage improvement, tests passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head increase-code-coverage
                 - Keep the diff focused and reviewable.
          - id: perspective-review
            name: Perspective-Based Code Review
            agent: ""
            prompt: |-
              Perform an independent code review of this repository from the perspective and focus areas defined in your own agent instructions.

              This is a review-only task: do NOT modify, create, or delete any repository files, and do NOT open a Pull Request. Your only output is a GitHub issue.

              Workflow:
              1. Review the generated Graphify graph and report in graphify-out/GRAPH_REPORT.md, then use the Graphify MCP tools (query_graph, get_node, get_neighbors, shortest_path) to navigate the codebase instead of scanning the tree blindly.
              2. From your persona's perspective, examine the code, workflows, and documentation for drawbacks, blind spots, risks, or missed opportunities that other reviewers commonly overlook.
              3. Prioritize findings that are concrete and actionable; cite exact file paths (and line numbers when applicable). Use `rtk` for any shell inspection, for example `rtk git grep` and `rtk cat`.
              4. Do not restate generic best practices; every finding must reference actual code or docs found in this repository.

              Issue body format:
              ## Persona
              State the reviewer persona and its focus area.

              ## Findings
              A bulleted list of concrete drawbacks/blind spots, each with a file path (and line number if applicable) and a one- or two-sentence explanation of the risk.

              ## Recommendations
              For each finding, one concrete, actionable recommendation.

              ## Out of Scope
              Note anything you considered but could not verify due to lack of evidence, rather than speculating.

              Issue filing:
              - Use the `gh` CLI through RTK, for example `rtk gh issue list` and `rtk gh issue create` (GITHUB_TOKEN is set in the environment), against repository ${{ github.repository }}.
              - Title the issue "Perspective review".
              - Label it "perspective-review" (create the label first if it does not exist).
              - If an open issue with this exact title already exists, update it instead of creating a duplicate.
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install RTK token saver
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v0.45.0/install.sh | sh
          rtk --version
          rtk init --global --copilot
      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: false
      - name: Generate repository map with Graphify
        run: |
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"

          uv tool install "graphifyy[mcp]"

          graphify --version
          graphify-mcp --help

          graphify . --no-viz --code-only
      - name: Select a random reviewer persona
        id: persona
        if: matrix.id == 'perspective-review'
        run: |
          set -euo pipefail

          # Pool of reviewer persona agents defined under .github/agents
          personas=(
            security-auditor
            performance-engineer
            accessibility-specialist
            site-reliability-engineer
            junior-developer
            technical-writer
            compliance-reviewer
            skeptical-staff-engineer
          )
          index=$(( RANDOM % ${#personas[@]} ))
          agent="${personas[$index]}"
          role=$(grep -m1 '^name:' ".github/agents/${agent}.agent.md" | sed -E 's/^name:[[:space:]]*"?([^"]*)"?[[:space:]]*$/\1/')

          echo "agent=${agent}" >> "$GITHUB_OUTPUT"
          echo "role=${role}" >> "$GITHUB_OUTPUT"
          echo "Selected persona: ${role} (${agent})"
      - name: Run Copilot CLI improvement agent
        uses: austenstone/copilot-cli@5a9fbe56fd6cdb5e50d329fd87c751748cf5182f # v4.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          allow-all-tools: true
          denied-tools: "shell(rm:*),shell(sudo:*),shell(chown:*),shell(chmod:777),shell(dd:*)"
          allow-all-paths: true
          allow-all-urls: true
          mcp-config: |
            {
              "mcpServers": {
                "graphify": {
                  "command": "graphify-mcp",
                  "args": ["graphify-out/graph.json"]
                }
              }
            }
          agent: ${{ matrix.agent || steps.persona.outputs.agent }}
          prompt: ${{ matrix.prompt }}
          fail-on-error: true
      - name: Collect Copilot usage metrics
        if: always()
        env:
          METRICS_NAME: ${{ matrix.name }}
          PERSONA_ROLE: ${{ steps.persona.outputs.role }}
        run: |
          {
            if [ -n "$PERSONA_ROLE" ]; then
              printf '## %s (%s)\n' "$METRICS_NAME" "$PERSONA_ROLE"
            else
              printf '## %s\n' "$METRICS_NAME"
            fi
            echo
            echo "### ccusage"
            echo '```'
            npx -y ccusage@latest || true
            echo '```'
            echo
            echo "### rtk stats"
            echo '```'
            rtk gain || true
            echo '```'
            echo
            echo "### Graphify usage"
            echo '```'
            if [ -f graphify-out/cost.json ]; then
              jq . graphify-out/cost.json || cat graphify-out/cost.json
            else
              echo "Graphify reported no usage/cost data for this run."
            fi
            echo '```'
          } | tee "metrics-${{ matrix.id }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Copilot usage metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-metrics-${{ matrix.id }}
          path: metrics-${{ matrix.id }}.md
          if-no-files-found: warn
  summarize:
    name: Publish Improvement Summary
    needs: run-improvers
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download Copilot usage metrics
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: copilot-metrics-*
          path: metrics
          merge-multiple: true
      - name: Publish improvement summary
        run: |
          echo "# Maintenance Improvement Metrics" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if find metrics -type f -name '*.md' | grep -q .; then
            find metrics -type f -name '*.md' -print | sort | while read -r metrics_file; do
              cat "$metrics_file" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No metrics artifacts were produced." >> "$GITHUB_STEP_SUMMARY"
          fi
