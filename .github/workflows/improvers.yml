name: "Maintenance: Code Base Quality Improvements"
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "0 0 15 * *"
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: code-quality-verifiers-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    name: Prepare Repository Map
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install rtk token saver
        run: |
          curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/tags/v0.45.0/install.sh | sh
          rtk --version
          rtk init --global --copilot
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Generate repository map with Graphify
        run: |
          uvx --from graphifyy graphify . --no-viz --code-only
      - name: Upload repository map
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graphify-out
          path: graphify-out/
          if-no-files-found: error
  run-improvers:
    name: ${{ matrix.name }}
    needs: prepare
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      copilot-requests: none
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: reduce-tech-debt
            name: Reduce Technical Debt
            agent: janitor
            prompt: |-
              Reduce technical debt and submit a Pull Request with the improvements.

              Workflow:
              1. Review the generated Graphify graph and report in graphify-out/GRAPH_REPORT.md, then use the Graphify MCP tools (query_graph, get_node, get_neighbors, shortest_path) to navigate the codebase instead of scanning the tree blindly.
              2. Analyze the repo for unused code, duplication, dead paths, and unnecessary complexity.
              3. Delete and simplify safely. Preserve behavior and avoid breaking public APIs.
              4. Validate by running: make test
              5. Create a new branch and push it:
                 - git checkout -b tech-debt-reduction
                 - git push origin tech-debt-reduction
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI: gh pr create \
                   --title "chore: reduce technical debt" \
                   --body "Summary of changes, rationale, tests passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head tech-debt-reduction
                 - Keep the diff focused and reviewable.
          - id: remove-ignored-rules
            name: Review Ignored/Suppressed Rules
            agent: janitor
            prompt: |-
              Review the codebase and configuration files for rules that are being ignored or suppressed, and remove that suppression by fixing the underlying issue with best practices where feasible.

              Workflow:
              1. Review the generated Graphify graph and report in graphify-out/GRAPH_REPORT.md, then use the Graphify MCP tools (query_graph, get_node, get_neighbors, shortest_path) to navigate the codebase instead of scanning the tree blindly.
              2. Search for suppression markers across the repo, including but not limited to:
                 - Go: `//nolint`, `//go:build ignore`
                 - jscpd: `jscpd:ignore-start` / `jscpd:ignore-end`
                 - YAML lint: `yamllint disable`, `yamllint disable-line`
                 - Shellcheck: `# shellcheck disable=`
                 - actionlint: entries in actionlint.yml
                 - zizmor: entries in zizmor.yaml
                 - trivy: entries in trivy.yaml or `.trivyignore`
                 - Super-Linter / other linters: `VALIDATE_*` exclusions, `.gitignore`-style ignore files, inline `# noqa`, `<!-- markdownlint-disable -->`
              3. For each suppression found, evaluate whether the underlying issue can be fixed properly instead of ignored:
                 - If fixable, apply the best-practice fix and remove the suppression.
                 - If not safely fixable (for example a false positive or an intentional, well-justified exception), leave the suppression in place but ensure it has a clear one-line comment explaining why it exists.
              4. Validate by running: make test and make lint
              5. Create a new branch and push it:
                 - git checkout -b remove-ignored-rules
                 - git push origin remove-ignored-rules
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI: gh pr create \
                   --title "chore: remove unnecessary rule suppressions" \
                   --body "Summary of suppressions removed, fixes applied, remaining justified exceptions, tests/lint passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head remove-ignored-rules
                 - Keep the diff focused and reviewable.
          - id: improve-code-coverage
            name: Improve Code Coverage
            agent: qa-subagent
            prompt: |-
              Increase code coverage and submit a Pull Request with the improvements.

              Workflow:
              1. Review the generated Graphify graph and report in graphify-out/GRAPH_REPORT.md, then use the Graphify MCP tools (query_graph, get_node, get_neighbors, shortest_path) to navigate the codebase instead of scanning the tree blindly.
              2. Analyze the latest results of unit-test and gremlins-test GitHub Actions jobs to identify uncovered code paths and functions.
              3. Write new tests to cover those paths, ensuring they are meaningful and validate important edge cases.
              4. Validate by running: make test
              5. Create a new branch and push it:
                 - git checkout -b increase-code-coverage
                 - git push origin increase-code-coverage
              6. Submit Pull Request via GitHub:
                 - Use GitHub CLI: gh pr create \
                   --title "test: increase code coverage" \
                   --body "Summary of added tests, rationale for coverage improvement, tests passing, and confirmation of no breaking changes." \
                   --base "$DEFAULT_BRANCH" \
                   --head increase-code-coverage
                 - Keep the diff focused and reviewable.
    steps:
      # jscpd:ignore-start
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Copilot CLI
        uses: austenstone/copilot-cli@5a9fbe56fd6cdb5e50d329fd87c751748cf5182f # v4.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        with:
          copilot-token: ${{ secrets.COPILOT_TOKEN }}
          allow-all-tools: true
          denied-tools: "shell(rm:*),shell(sudo:*),shell(chown:*),shell(chmod:777),shell(dd:*)"
          allow-all-paths: true
          allow-all-urls: true
          mcp-config: |
            {
              "mcpServers": {
                "graphify": {
                  "command": "graphify",
                  "args": [".", "--mcp"]
                }
              }
            }
          # jscpd:ignore-end
          agent: ${{ matrix.agent }}
          prompt: ${{ matrix.prompt }}
          fail-on-error: true
      - name: Collect usage metrics
        if: always()
        run: |
          {
            echo "## ${{ matrix.name }}"
            echo
            echo "### ccusage"
            echo '```'
            npx -y ccusage@latest || true
            echo '```'
            echo
            echo "### rtk stats"
            echo '```'
            rtk gain || true
            echo '```'
          } | tee "metrics-${{ matrix.id }}.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload usage metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: copilot-metrics-${{ matrix.id }}
          path: metrics-${{ matrix.id }}.md
          if-no-files-found: warn
  summarize:
    name: Publish Improvement Summary
    needs: run-improvers
    if: always() && github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download usage metrics
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: copilot-metrics-*
          path: metrics
          merge-multiple: true
      - name: Publish workflow summary
        run: |
          echo "# Maintenance Improvement Metrics" >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          if find metrics -type f -name '*.md' | grep -q .; then
            find metrics -type f -name '*.md' -print | sort | while read -r metrics_file; do
              cat "$metrics_file" >> "$GITHUB_STEP_SUMMARY"
              echo >> "$GITHUB_STEP_SUMMARY"
            done
          else
            echo "No metrics artifacts were produced." >> "$GITHUB_STEP_SUMMARY"
          fi
